name: carrier_records
description: Internal transport records, reports and bills.
publish_to: none
version: 0.1.0+6

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.2
  flutter_secure_storage: 11.2.0
  file_selector: 1.1.0
  pdf: 3.13.1
  printing: 5.15.1
  archive: 4.5.1
  crypto: 3.0.7
  share_plus: 13.3.1
  xml: 7.0.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
