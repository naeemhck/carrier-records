name: carrier_records
description: Karvaan bilingual internal transport records, reports and bills.
publish_to: none
version: 0.2.0+17

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.2
  flutter_secure_storage: 11.2.0
  file_selector: 1.1.0
  pdf: 3.13.1
  printing: 5.15.1
  archive: 4.5.1
  crypto: 3.0.7
  share_plus: 13.3.1
  xml: 7.0.1
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
    - assets/fonts/NotoSansArabic-OFL.txt
    - assets/fonts/NotoSansMath-Regular.ttf
    - assets/fonts/NotoSansMath-OFL.txt
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath-Regular.ttf
